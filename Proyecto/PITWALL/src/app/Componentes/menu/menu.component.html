@let isHandset = this.isHandset();

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="isHandset ? 'dialog' : 'navigation'"
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="isHandset === false"
  >
    <mat-toolbar class="brand-toolbar">Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item href="inicio">Inicio</a>
      <a mat-list-item href="clientes">Clientes</a>
      <a mat-list-item href="productos">Productos</a>
      <a mat-list-item href="reservas">Reservas</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar>
      @if (isHandset) {
        <button type="button" aria-label="Toggle sidenav" matIconButton (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <span>PITWALL</span>
    </mat-toolbar>
      <router-outlet></router-outlet> 
  </mat-sidenav-content>
</mat-sidenav-container>
